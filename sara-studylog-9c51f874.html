<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習ログ（非公開） | ねこまた発酵中</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<style>
  body { --page-accent: var(--accent-study); --page-accent-soft: var(--accent-study-soft); --page-accent-dark: var(--accent-study-dark); }

  .private-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-other-soft);
    color: var(--accent-other-dark);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 11.5px;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .stopwatch-box {
    background: var(--base-bg);
    border: 1px solid var(--base-border);
    border-radius: var(--radius-lg);
    padding: 20px;
    text-align: center;
    margin-bottom: 4px;
  }
  .sw-time {
    font-size: 36px;
    font-weight: 800;
    color: var(--page-accent-dark);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  .sw-accumulated {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .sw-accumulated strong { color: var(--page-accent-dark); font-weight: 800; }
  .sw-btn-row { display: flex; gap: 10px; }
  .sw-btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
  }
  .sw-btn.start { background: var(--page-accent); color: #fffdf8; }
  .sw-btn.stop { background: var(--accent-other-dark); color: #fffdf8; }
  .sw-btn.reset { background: var(--base-bg-card); color: var(--ink-soft); border: 1px solid var(--base-border); flex: 0 0 auto; padding: 13px 18px; }
  .sw-btn:disabled { opacity: 0.4; cursor: default; }
  .sw-status { font-size: 11.5px; color: var(--ink-soft); margin-top: 10px; min-height: 14px; }
  .sw-status.running { color: var(--page-accent-dark); font-weight: 700; }

  .form-grid { display: flex; flex-direction: column; gap: 14px; }
  .field-block { background: var(--base-bg); border: 1px solid var(--base-border); border-radius: var(--radius-md); padding: 14px 16px; }
  .field-block label.title { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 8px; }

  input[type="text"], input[type="number"], input[type="date"], select {
    border: 1px solid var(--base-border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    background: var(--base-bg-card);
    color: var(--ink);
  }
  select { width: 100%; }
  input[type="text"] { width: 100%; }

  .inline-row { display: flex; align-items: center; gap: 10px; }
  .inline-row input[type="number"] { width: 90px; }
  .inline-row .fill-btn {
    border: 1px solid var(--page-accent);
    background: var(--page-accent-soft);
    color: var(--page-accent-dark);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .submit-btn {
    width: 100%;
    background: var(--page-accent);
    color: #fffdf8;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
  }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }

  #log-status { font-size: 12.5px; margin-top: 8px; min-height: 16px; }
  #log-status.ok { color: var(--accent-study-dark); }
  #log-status.err { color: #a32d2d; }

  .history-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    border: 1px solid var(--base-border); border-radius: 8px;
    padding: 9px 12px; margin-bottom: 7px; font-size: 12.5px;
  }
  .history-row .h-date { font-weight: 800; min-width: 50px; color: var(--page-accent-dark); }
  .history-row .h-tag { background: var(--page-accent-soft); color: var(--page-accent-dark); border-radius: 999px; padding: 2px 9px; font-size: 11px; }
  .history-row .h-content { color: var(--ink); flex: 1; min-width: 120px; }
  #history-list .loading { font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <a href="index.html" class="logo"><span class="cat-ear-frame"><img src="images/logo-icon.png" alt=""></span><span class="playful-heading">ねこまた発酵中</span></a>
  </header>

  <div class="page-hero">
    <span class="private-badge">🔒 非公開ページ</span>
    <h1>学習ログ</h1>
    <p>日々の学習内容と時間を記録。進捗の見える化は <a href="learning.html" style="color:var(--page-accent-dark); font-weight:700;">learning.html</a> へ。</p>
  </div>

  <div class="card">
    <h2>ストップウォッチ</h2>
    <div class="stopwatch-box">
      <div class="sw-time" id="sw-display">00:00:00</div>
      <div class="sw-accumulated">この日の積算時間：<strong id="sw-accumulated-min">0</strong>分</div>
      <div class="sw-btn-row">
        <button class="sw-btn start" id="sw-start-btn">開始</button>
        <button class="sw-btn stop" id="sw-stop-btn" disabled>終了</button>
        <button class="sw-btn reset" id="sw-reset-btn">リセット</button>
      </div>
      <div class="sw-status" id="sw-status"></div>
    </div>
  </div>

  <div class="card">
    <h2>今日の学習ログ</h2>
    <form id="log-form" class="form-grid">
      <div class="field-block">
        <label class="title">学習日</label>
        <input type="date" id="log-date" required>
      </div>
      <div class="field-block">
        <label class="title">カテゴリ</label>
        <select id="log-category">
          <option value="財表">財表（税理士試験）</option>
          <option value="法人税法">法人税法（税理士試験）</option>
          <option value="近大">近大通信</option>
          <option value="産能大">産能大</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="field-block">
        <label class="title">学習内容</label>
        <input type="text" id="log-content" placeholder="例：理論問題集 第3章、過去問演習など">
      </div>
      <div class="field-block">
        <label class="title">学習時間</label>
        <div class="inline-row">
          <input type="number" id="log-minutes" placeholder="分" min="0" max="600">
          <span style="font-size:13px; color:var(--ink-soft);">分</span>
          <button type="button" class="fill-btn" id="fill-from-sw-btn">⏱ 積算時間を入れる</button>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="log-submit-btn">記録する</button>
      <div id="log-status"></div>
    </form>
  </div>

  <div class="card">
    <h2>学習履歴</h2>
    <div id="history-list"><p class="loading">読み込み中…</p></div>
  </div>

  <footer class="site-footer">
    ねこまた発酵中
  </footer>

</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwaZx_bNjdmJnyV2wSdmSrdyR-SYGlVUEMKDazAEW4oGb7INTFfntMZIomzItU-MBJvTQ/exec';

  const $ = id => document.getElementById(id);

  function todayStr() {
    const d = new Date();
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }

  $('log-date').value = todayStr();

  function dateLabel(d) {
    if (!d) return '';
    const md = new Date(String(d).slice(0, 10) + 'T00:00:00');
    if (isNaN(md.getTime())) return String(d);
    return (md.getMonth() + 1) + '/' + md.getDate();
  }

  // ---------- ストップウォッチ（開始→終了を繰り返して積算） ----------
  const SW_STORAGE_KEY = 'sw_accumulated_seconds_' + todayStr();
  let swRunning = false;
  let swStartTime = null;
  let swIntervalId = null;
  let swAccumulatedSeconds = Number(sessionStorage.getItem(SW_STORAGE_KEY) || 0);

  function formatHMS(totalSeconds) {
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = Math.floor(totalSeconds % 60);
    const pad = n => String(n).padStart(2, '0');
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }

  function updateSwDisplay() {
    let current = swAccumulatedSeconds;
    if (swRunning && swStartTime) {
      current += (Date.now() - swStartTime) / 1000;
    }
    $('sw-display').textContent = formatHMS(current);
    $('sw-accumulated-min').textContent = Math.round(current / 60);
  }

  $('sw-start-btn').addEventListener('click', () => {
    if (swRunning) return;
    swRunning = true;
    swStartTime = Date.now();
    $('sw-start-btn').disabled = true;
    $('sw-stop-btn').disabled = false;
    $('sw-status').textContent = '計測中…';
    $('sw-status').className = 'sw-status running';
    swIntervalId = setInterval(updateSwDisplay, 1000);
  });

  $('sw-stop-btn').addEventListener('click', () => {
    if (!swRunning) return;
    const elapsed = (Date.now() - swStartTime) / 1000;
    swAccumulatedSeconds += elapsed;
    sessionStorage.setItem(SW_STORAGE_KEY, String(swAccumulatedSeconds));
    swRunning = false;
    swStartTime = null;
    clearInterval(swIntervalId);
    $('sw-start-btn').disabled = false;
    $('sw-stop-btn').disabled = true;
    $('sw-status').textContent = '一時停止中。「開始」で再開できます';
    $('sw-status').className = 'sw-status';
    updateSwDisplay();
  });

  $('sw-reset-btn').addEventListener('click', () => {
    if (swRunning) {
      clearInterval(swIntervalId);
      swRunning = false;
      swStartTime = null;
      $('sw-start-btn').disabled = false;
      $('sw-stop-btn').disabled = true;
    }
    swAccumulatedSeconds = 0;
    sessionStorage.removeItem(SW_STORAGE_KEY);
    $('sw-status').textContent = 'リセットしました';
    $('sw-status').className = 'sw-status';
    updateSwDisplay();
  });

  $('fill-from-sw-btn').addEventListener('click', () => {
    let current = swAccumulatedSeconds;
    if (swRunning && swStartTime) {
      current += (Date.now() - swStartTime) / 1000;
    }
    // 30秒未満は切り捨て、30秒以上は切り上げ
    const minutes = Math.floor(current / 60);
    const remainderSeconds = current % 60;
    const roundedMinutes = remainderSeconds >= 30 ? minutes + 1 : minutes;
    $('log-minutes').value = roundedMinutes;
  });

  updateSwDisplay();

  // ---------- 学習ログ ----------
  $('log-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = $('log-submit-btn');
    const statusEl = $('log-status');
    btn.disabled = true;
    statusEl.textContent = '送信中…';
    statusEl.className = '';

    const params = new URLSearchParams({
      type: 'log',
      date: $('log-date').value,
      category: $('log-category').value,
      content: $('log-content').value || '',
      minutes: $('log-minutes').value || ''
    });

    try {
      await fetch(GAS_URL, { method: 'POST', body: params });
      statusEl.textContent = '記録しました';
      statusEl.className = 'ok';
      $('log-content').value = '';
      $('log-minutes').value = '';
      loadHistory();
    } catch (err) {
      statusEl.textContent = '記録に失敗しました。もう一度試してね';
      statusEl.className = 'err';
    } finally {
      btn.disabled = false;
    }
  });

  async function loadHistory() {
    const listEl = $('history-list');
    listEl.innerHTML = '<p class="loading">読み込み中…</p>';
    try {
      const res = await fetch(GAS_URL + '?type=log');
      const rows = await res.json();
      if (!rows || rows.length === 0) {
        listEl.innerHTML = '<p class="loading">まだ記録がありません</p>';
        return;
      }
      // 日付の降順（新しい日付が上）にソート。同日は元の並び順（新しい記録が下）を維持
      const sorted = rows.slice().sort((a, b) => {
        const da = String(a.date).slice(0, 10);
        const db = String(b.date).slice(0, 10);
        return db.localeCompare(da);
      }).slice(0, 31);
      listEl.innerHTML = sorted.map(r => {
        const tags = [];
        if (r.category) tags.push(r.category);
        if (r.minutes) tags.push(r.minutes + '分');
        const tagHtml = tags.map(t => '<span class="h-tag">' + t + '</span>').join('');
        return '<div class="history-row"><span class="h-date">' + dateLabel(r.date) + '</span>' + tagHtml +
          (r.content ? '<span class="h-content">' + escapeHtml(String(r.content)) + '</span>' : '') + '</div>';
      }).join('');
    } catch (err) {
      listEl.innerHTML = '<p class="loading">履歴を取得できませんでした</p>';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadHistory();
</script>
</body>
</html>

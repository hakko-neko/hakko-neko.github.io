<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth | ねこまた発酵中</title>
<link rel="stylesheet" href="style.css">
<style>
  body { --page-accent: var(--accent-health); --page-accent-soft: var(--accent-health-soft); --page-accent-dark: var(--accent-health-dark); }

  .streak-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 600px) { .streak-grid { grid-template-columns: 1fr; } }

  .streak-card {
    background: var(--base-bg);
    border: 1px solid var(--base-border);
    border-radius: var(--radius-md);
    padding: 18px;
    text-align: center;
  }
  .streak-card .s-num { font-size: 28px; font-weight: 800; color: var(--page-accent-dark); }
  .streak-card .s-label { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

  .placeholder-note {
    text-align: center;
    padding: 24px;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--base-bg);
    border: 1px dashed var(--base-border);
    border-radius: var(--radius-md);
  }

  .month-report-list { display: flex; flex-direction: column; gap: 14px; }
  .month-report-card {
    background: var(--base-bg);
    border: 1px solid var(--base-border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
  }
  .month-report-card .mr-title {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--page-accent-dark);
    margin-bottom: 10px;
  }
  .month-report-card .mr-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .month-report-card .mr-stat {
    background: var(--base-bg-card);
    border: 1px solid var(--base-border);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .month-report-card .mr-reflection {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.7;
    background: var(--base-bg-card);
    border-left: 3px solid var(--page-accent);
    padding: 10px 14px;
    border-radius: 6px;
  }
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <a href="index.html" class="logo"><span class="cat-ear-frame"><img src="images/logo-icon.png" alt=""></span><span class="playful-heading">ねこまた発酵中</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="learning.html">Learning</a>
      <a href="writing.html">Writing</a>
      <a href="projects.html">Projects</a>
      <a href="growth.html" class="active">Growth</a>
    </nav>
  </header>

  <div class="page-hero">
    <div class="eyebrow">GROWTH</div>
    <h1>Growth</h1>
    <p>月次レポート、継続日数、過去からの変化をまとめています。</p>
  </div>

  <div class="card">
    <h2>継続記録</h2>
    <div class="streak-grid">
      <div class="streak-card">
        <div class="s-num" id="streak-days">—</div>
        <div class="s-label">継続更新日数</div>
      </div>
      <div class="streak-card">
        <div class="s-num" id="total-days">—</div>
        <div class="s-label">のべ活動日数</div>
      </div>
    </div>
    <p style="font-size:11.5px; color:var(--ink-soft); margin-top:10px; margin-bottom:0;">
      健康記録・学習記録の入力、またはこのサイトの更新（GitHubへのコミット）のいずれかがあった日をカウントしています。
    </p>
  </div>

  <div class="card">
    <h2>月次レポート</h2>
    <div class="month-report-list" id="month-report-list">
      <p class="placeholder-note">読み込み中…</p>
    </div>
  </div>

  <footer class="site-footer">
    ねこまた発酵中
  </footer>

</div>

<script>
  const HEALTH_GAS_URL = 'https://script.google.com/macros/s/AKfycbxcG5koxkbuJ7c44aPmVAe-jpXJXW8dsl4aot_tIniA7-Nc7GJm3r-AOQHyXrndb4Mv/exec';
  const STUDY_GAS_URL = 'https://script.google.com/macros/s/AKfycbwaZx_bNjdmJnyV2wSdmSrdyR-SYGlVUEMKDazAEW4oGb7INTFfntMZIomzItU-MBJvTQ/exec';
  const GITHUB_API_URL = 'https://api.github.com/repos/hakko-neko/hakko-neko.github.io/commits?per_page=100';
  const MONTHLY_REPORT_GAS_URL = 'https://script.google.com/macros/s/AKfycbyjF5cONqHklmUj1WTDGlug8mKE0OwBoWmOyUK-HrGb9pL68ai7nbZEnCwJpkMOQ5F6xg/exec';

  function toDateStr(d) {
    // タイムゾーンに関わらず "YYYY-MM-DD" の日付文字列に正規化
    const dt = new Date(d);
    const tz = dt.getTimezoneOffset() * 60000;
    return new Date(dt - tz).toISOString().slice(0, 10);
  }

  async function fetchHealthDates() {
    try {
      const res = await fetch(HEALTH_GAS_URL);
      const rows = await res.json();
      return rows.map(r => String(r.date).slice(0, 10)).filter(Boolean);
    } catch (e) { return []; }
  }

  async function fetchStudyDates() {
    try {
      const res = await fetch(STUDY_GAS_URL + '?type=log');
      const rows = await res.json();
      return rows.map(r => String(r.date).slice(0, 10)).filter(Boolean);
    } catch (e) { return []; }
  }

  async function fetchCommitDates() {
    try {
      const res = await fetch(GITHUB_API_URL);
      const commits = await res.json();
      if (!Array.isArray(commits)) return [];
      return commits.map(c => toDateStr(c.commit.author.date));
    } catch (e) { return []; }
  }

  function calcStreak(dateSet) {
    let streak = 0;
    let cursor = new Date();
    while (true) {
      const ds = toDateStr(cursor);
      if (dateSet.has(ds)) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  async function loadStreak() {
    const [healthDates, studyDates, commitDates] = await Promise.all([
      fetchHealthDates(), fetchStudyDates(), fetchCommitDates()
    ]);
    const allDates = new Set([...healthDates, ...studyDates, ...commitDates]);

    const streak = calcStreak(allDates);
    document.getElementById('streak-days').textContent = streak + '日';
    document.getElementById('total-days').textContent = allDates.size + '日';
  }

  function yearMonthLabel(ym) {
    const [y, m] = String(ym).split('-');
    return y + '年' + Number(m) + '月';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadMonthlyReports() {
    const listEl = document.getElementById('month-report-list');
    try {
      const res = await fetch(MONTHLY_REPORT_GAS_URL);
      const rows = await res.json();
      if (!rows || rows.length === 0) {
        listEl.innerHTML = '<p class="placeholder-note">まだ月次レポートがありません</p>';
        return;
      }
      const sorted = rows.slice().sort((a, b) => String(b.year_month).localeCompare(String(a.year_month)));
      listEl.innerHTML = sorted.map(r => {
        const studyHours = r.study_minutes_total ? (Number(r.study_minutes_total) / 60).toFixed(1) : '0';
        return '<div class="month-report-card">' +
          '<div class="mr-title">' + yearMonthLabel(r.year_month) + '</div>' +
          '<div class="mr-stats">' +
            '<span class="mr-stat">📚 学習 ' + studyHours + '時間</span>' +
            '<span class="mr-stat">📝 学習記録 ' + (r.study_days || 0) + '日</span>' +
            '<span class="mr-stat">🌿 健康記録 ' + (r.health_days || 0) + '日</span>' +
          '</div>' +
          (r.reflection ? '<div class="mr-reflection">' + escapeHtml(String(r.reflection)) + '</div>' : '') +
          '</div>';
      }).join('');
    } catch (err) {
      listEl.innerHTML = '<p class="placeholder-note">読み込みに失敗しました</p>';
    }
  }

  loadStreak();
  loadMonthlyReports();
</script>
<script src="secret.js"></script>
</body>
</html>
